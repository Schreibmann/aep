name: CI

on:
  push:
    branches:
      - main
      - develop
      - "aep/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - "22.13.0"
          - "26"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # CI never uses Cursor credentials. Live SDK smoke tests are opt-in locally (AEP-002+).
      - name: Confirm no Cursor secret required
        shell: bash
        run: |
          if [ -n "${CURSOR_API_KEY:-}" ]; then
            echo "CI must not depend on CURSOR_API_KEY" >&2
            exit 1
          fi
          echo "CURSOR_API_KEY unset — OK"
